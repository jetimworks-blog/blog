<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summer Sale</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0f0f0f;
      padding: 40px 20px;
    }
    .email-wrapper {
      max-width: 600px;
      margin: 0 auto;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #222;
    }
    .hero {
      background: linear-gradient(135deg, #ff6b35 0%, #ff2d92 50%, #7c3aed 100%);
      padding: 70px 40px;
      text-align: center;
      position: relative;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(to top, #111, transparent);
    }
    .sale-label {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      color: white;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }
    .hero h1 {
      font-size: 56px;
      font-weight: 700;
      color: white;
      line-height: 1.1;
      margin-bottom: 15px;
      text-shadow: 0 4px 30px rgba(0,0,0,0.3);
    }
    .hero .discount {
      font-size: 80px;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 0 60px rgba(255, 215, 0, 0.5);
    }
    .hero p {
      color: rgba(255,255,255,0.9);
      font-size: 18px;
      margin-top: 15px;
    }
    .timer {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 35px;
    }
    .timer-block {
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 15px 20px;
      text-align: center;
      min-width: 70px;
    }
    .timer-number {
      font-size: 32px;
      font-weight: 700;
      color: white;
    }
    .timer-label {
      font-size: 10px;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .content {
      padding: 50px 40px;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 35px;
    }
    .product {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      transition: transform 0.2s, border-color 0.2s;
    }
    .product:hover {
      transform: translateY(-4px);
      border-color: #ff6b35;
    }
    .product-img {
      height: 140px;
      background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      opacity: 0.5;
    }
    .product-info {
      padding: 15px;
    }
    .product-name {
      font-size: 14px;
      color: #fff;
      margin-bottom: 8px;
    }
    .product-price {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .old-price {
      font-size: 13px;
      color: #666;
      text-decoration: line-through;
    }
    .new-price {
      font-size: 16px;
      font-weight: 700;
      color: #ff6b35;
    }
    .shop-btn {
      display: block;
      background: linear-gradient(135deg, #ff6b35, #ff2d92);
      color: white;
      text-align: center;
      padding: 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }
    .shop-btn:hover { opacity: 0.9; }
    .footer-text {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="hero">
      <div class="sale-label">Limited Time Offer</div>
      <h1>Summer</h1>
      <div class="discount">50% OFF</div>
      <p>Everything you need for the perfect season</p>
      <div class="timer">
        <div class="timer-block">
          <div class="timer-number">02</div>
          <div class="timer-label">Days</div>
        </div>
        <div class="timer-block">
          <div class="timer-number">14</div>
          <div class="timer-label">Hours</div>
        </div>
        <div class="timer-block">
          <div class="timer-number">37</div>
          <div class="timer-label">Mins</div>
        </div>
        <div class="timer-block">
          <div class="timer-number">52</div>
          <div class="timer-label">Secs</div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="products">
        <div class="product">
          <div class="product-img">&#9679;</div>
          <div class="product-info">
            <div class="product-name">Premium Sunglasses</div>
            <div class="product-price">
              <span class="old-price">$89</span>
              <span class="new-price">$44</span>
            </div>
          </div>
        </div>
        <div class="product">
          <div class="product-img">&#9679;</div>
          <div class="product-info">
            <div class="product-name">Beach Tote Bag</div>
            <div class="product-price">
              <span class="old-price">$65</span>
              <span class="new-price">$32</span>
            </div>
          </div>
        </div>
        <div class="product">
          <div class="product-img">&#9679;</div>
          <div class="product-info">
            <div class="product-name">Linen Summer Dress</div>
            <div class="product-price">
              <span class="old-price">$120</span>
              <span class="new-price">$60</span>
            </div>
          </div>
        </div>
        <div class="product">
          <div class="product-img">&#9679;</div>
          <div class="product-info">
            <div class="product-name">Sandals Collection</div>
            <div class="product-price">
              <span class="old-price">$75</span>
              <span class="new-price">$37</span>
            </div>
          </div>
        </div>
      </div>
      <a href="#" class="shop-btn">Shop the Sale</a>
      <p class="footer-text">Use code SUMMER50 at checkout. Valid until June 15th.</p>
    </div>
  </div>
</body>
</html>
